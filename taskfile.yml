---
version: "3"

tasks:
  default:
    desc: build dll
    cmds:
      - odin build ./simple-dll/ -target:windows_i386 -build-mode:dll -out:simple.dll

  injector:
    desc: build injector
    cmds:
      - odin build ./injector/ -target:windows_i386 -out:injector.exe

  clean:
    desc: clean up
    cmds:
      - rm *.obj

  main:
    desc: main account
    cmds:
      - protontricks -c 'wine injector.exe' 4240740151

  steam:
    desc: steam account
    cmds:
      - protontricks -c 'wine injector.exe' 550470
